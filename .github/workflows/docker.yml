name: Docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      refresh_dependencies:
        description: Rebuild without cache to refresh Chrome and system packages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha
          flavor: latest=false

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: coldvideo-downloader:ci
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_dependencies }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check CLI and bundled tools
        run: |
          docker run --rm --network none coldvideo-downloader:ci --help
          docker run --rm --network none --entrypoint sh coldvideo-downloader:ci -ec \
            'command -v google-chrome; command -v ffmpeg; command -v ffprobe'

      - name: Run local tests inside image
        run: |
          docker run --rm --init --shm-size=1g --network none \
            --mount "type=bind,source=$PWD/tests,target=/tests,readonly" \
            --entrypoint python coldvideo-downloader:ci \
            -W error::RuntimeWarning -m unittest discover -s /tests -v

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag coldvideo-downloader:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
